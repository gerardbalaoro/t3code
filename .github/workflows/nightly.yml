name: Nightly

# Builds and publishes one `dev/main` commit as a nightly release. Sync starts
# it; it can also be run by hand with a `dev/main` commit.
#
# Packaging is upstream's own release-desktop.yml, called from `dev/main`, so its
# fixes arrive with every sync. The jobs around it mirror the parts of
# upstream's release.yml that apply to a fork: version, JS bundle, publish.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "dev/main commit to build (full SHA)"
        required: true
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  # Windows packaging reads this run's artifact list to wait for the Linux CLI.
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      upstream_commit: ${{ steps.version.outputs.upstream_commit }}
      clerk_publishable_key: ${{ steps.connect.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.connect.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.connect.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.connect.outputs.relay_url }}
    steps:
      - name: Check the commit is on dev/main
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full commit SHA" >&2; exit 1; }
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/main" --jq .object.sha)"
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$REF...$head" --jq .status)"
          [[ "$status" == "identical" || "$status" == "ahead" ]] ||
            { echo "$REF is not on dev/main ($status)" >&2; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      # Share the same lockfile verification with every packaging job, as upstream does.
      - name: Upload dependency verification
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl

      - id: version
        run: |
          upstream="$(git merge-base HEAD origin/upstream/main)"
          upstream_tags="$(git ls-remote --tags https://github.com/pingdotgg/t3code.git 'v*-nightly.*')"
          tag="$(awk -v sha="$upstream" '$1 == sha { sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2 }' <<< "$upstream_tags" | sort -V | tail -n 1)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "No upstream nightly version found for $upstream." >&2
            exit 1
          fi
          {
            echo "upstream_commit=$upstream"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      # T3 Connect's public production values, as upstream ships them for forks.
      - id: connect
        run: |
          value() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          {
            echo "clerk_publishable_key=$(value CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(value CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(value CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(value RELAY_URL)"
          } | tee -a "$GITHUB_OUTPUT"
          ! grep -q '=$' "$GITHUB_OUTPUT"

  build_bundle:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.preflight.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.preflight.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.preflight.outputs.relay_url }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Check bundle-only build support
        id: bundle_build
        run: |
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - if: steps.bundle_build.outputs.script == 'build:desktop'
        uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        if: steps.bundle_build.outputs.script == 'build:desktop'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run ${{ steps.bundle_build.outputs.script }}

      # The artifact root is apps/; packaging jobs download it into apps/.
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Use upstream's packaging on GitHub-hosted runners. macOS ships arm64 only.
  # Builds are unsigned. To sign, pass the signing secrets by name here.
  desktop_mac_arm64:
    needs: [preflight, build_bundle]
    uses: gerardbalaoro/t3code/.github/workflows/release-desktop.yml@dev/main
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ inputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true

  desktop_linux_x64:
    needs: [preflight, build_bundle]
    uses: gerardbalaoro/t3code/.github/workflows/release-desktop.yml@dev/main
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ inputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  desktop_linux_arm64:
    needs: [preflight, build_bundle]
    uses: gerardbalaoro/t3code/.github/workflows/release-desktop.yml@dev/main
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ inputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true

  desktop_win_x64:
    needs: [preflight, build_bundle]
    uses: gerardbalaoro/t3code/.github/workflows/release-desktop.yml@dev/main
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ inputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  desktop_win_arm64:
    needs: [preflight, build_bundle]
    uses: gerardbalaoro/t3code/.github/workflows/release-desktop.yml@dev/main
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ inputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Windows arm64
      runner: ubuntu-24.04
      verify_runner: windows-11-arm
      platform: win
      target: nsis
      arch: arm64
      rust_target: aarch64-pc-windows-msvc
      resource_key: win32-arm64
      cli_archive: true

  publish:
    needs:
      [
        preflight,
        desktop_mac_arm64,
        desktop_linux_x64,
        desktop_linux_arm64,
        desktop_win_x64,
        desktop_win_arm64,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      NAME: G Code Nightly ${{ needs.preflight.outputs.version }} (upstream ${{ needs.preflight.outputs.tag }})
      REF: ${{ inputs.ref }}
    steps:
      # Publishing creates the tag on a commit that changes workflow files.
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.app.outputs.token }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Installers verify archives against this file.
      - working-directory: release-assets
        run: |
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          (( ${#archives[@]} > 0 )) || { echo "No CLI archives were produced." >&2; exit 1; }
          sha256sum "${archives[@]}" > SHA256SUMS

      # The macOS manifest already contains its only architecture. Windows still
      # needs both architectures in one feed. Use the Windows merger directly
      # because upstream's all-platform merger requires a macOS x64 manifest.
      - name: Merge Windows update manifests
        shell: bash
        run: |
          shopt -s nullglob
          mac=(release-assets/*-mac.yml)
          win_x64=(release-assets/*-win-x64.yml)
          win_arm64=(release-assets/*-win-arm64.yml)
          if (( ${#mac[@]} == 0 || ${#win_x64[@]} == 0 || ${#win_x64[@]} != ${#win_arm64[@]} )); then
            echo "Expected macOS arm64 manifests and complete Windows architecture pairs." >&2
            exit 1
          fi
          for primary in "${win_x64[@]}"; do
            channel="${primary%-win-x64.yml}"
            secondary="$channel-win-arm64.yml"
            [[ -f "$secondary" ]] || { echo "Missing Windows manifest: $secondary" >&2; exit 1; }
            node scripts/merge-update-manifests.ts --platform win "$primary" "$secondary" "$channel.yml"
            rm -- "$primary" "$secondary"
          done

      # Find the upstream nightly used to assemble this build.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.preflight.outputs.upstream_commit }}
        run: |
          gh api "repos/pingdotgg/t3code/releases/tags/$TAG" --jq '.body // ""' > upstream-notes.md
          grep -q '[^[:space:]]' upstream-notes.md ||
            { echo "The upstream release has no notes for $TAG." >&2; exit 1; }
          IFS= read -r first_line < upstream-notes.md
          heading="**$TAG**"
          {
            echo "### G Code patches"
            echo
            git log --reverse --format='- %s' "$UPSTREAM_COMMIT..$REF"
            printf '\n---\n\n'
            if [[ "$first_line" == "$heading"* ]]; then
              printf '### %s%s\n' "$TAG" "${first_line#"$heading"}"
              tail -n +2 upstream-notes.md
            elif [[ "$first_line" == "### $TAG"* ]]; then
              cat upstream-notes.md
            else
              printf '### %s\n\n' "$TAG"
              cat upstream-notes.md
            fi
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # A draft hides a new release until every file is attached and the tag
      # points to the build commit. Publish as Latest so mise can find it.
      # Updaters match "nightly" in the tag regardless of the prerelease flag.
      - name: Publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          shopt -s nullglob extglob
          files=(release-assets/*.{dmg,zip,AppImage,deb,exe,blockmap,tar.gz} release-assets/!(builder-debug).yml release-assets/SHA256SUMS)
          if release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isImmutable)"; then
            if jq -e '.isImmutable' <<< "$release" >/dev/null; then
              echo "GitHub marked release $TAG immutable." >&2
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            previous_assets="$(jq -r '.assets[].name' <<< "$release")"
            while IFS= read -r asset; do
              if [[ -n "$asset" ]] && ! printf '%s\n' "${files[@]##*/}" | grep -Fx -- "$asset" >/dev/null; then
                gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done <<< "$previous_assets"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$REF" --title "$NAME" --notes-file notes.md "${files[@]}"
          fi

          tag_ref="refs/tags/$TAG"
          existing="$(git ls-remote --refs --tags origin "$tag_ref")"
          existing_sha="${existing%%$'\t'*}"
          if [[ "$existing_sha" != "$REF" ]]; then
            git push "--force-with-lease=$tag_ref:$existing_sha" origin "${REF}:$tag_ref"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "$NAME" --notes-file notes.md --draft=false --latest

      # Desktop nightlies find their update through update-feed/nightly.json
      # (upstream's electron-updater patch), so point it at this release.
      - name: Point the update feed at this nightly
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '{tag_name, name, body}' > nightly.json
          gh release view update-feed > /dev/null 2>&1 ||
            gh release create update-feed --prerelease --latest=false --title "Update feed" \
              --notes "Desktop nightlies read nightly.json here to find the newest nightly. Do not delete it."
          gh release upload update-feed nightly.json --clobber
          gh release edit update-feed --draft=false --prerelease --latest=false
